<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NYC Housing Violations — search by issue</title>
  <meta name="description"
    content="Search the last 30 days of NYC HPD housing violations by issue — mice, mold, no heat, and more." />
  <style>
    :root {
      --bg: #FAF8F4;
      --ink: #3A3836;
      --ink-soft: #555555;
      --line: #3A3836;
      /*#242323;*/
      --sans: ui-monospace, "SF Mono", "Cascadia Code", "Consolas", "Roboto Mono", "Menlo", monospace;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      line-height: 1.5;
    }

    a {
      color: var(--ink);
    }

    .wrap {
      max-width: 680px;
      margin: 0 auto;
      padding: 56px 20px 80px;
    }

    header {
      margin-bottom: 20px;
    }

    .eyebrow {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--ink-soft);
      margin: 0 0 10px;
    }

    /*
    h1 {
      font-weight: 800;
      font-size: clamp(30px, 6vw, 42px);
      letter-spacing: -0.02em;
      line-height: 1.05;
      margin: 0 0 14px;
      color: var(--ink);
    }
      */


    h1 {
      display: inline-block;
      font-weight: 800;
      font-size: clamp(24px, 5vw, 36px);
      letter-spacing: -0.02em;
      line-height: 1.05;
      margin: 0 0 14px;
      background: #3A3836;
      color: var(--bg);
      padding: 8px 16px;
    }


    .sub {
      font-size: 16px;
      color: var(--ink-soft);
      max-width: 52ch;
    }

    .sub strong {
      color: var(--ink);
      font-weight: 700;
    }

    .search-row {
      margin: 20px 0 20px;
    }

    #q {
      width: 100%;
      font-family: var(--sans);
      font-size: 18px;
      padding: 16px 18px;
      border: 2px solid var(--ink);
      background: #FAF8F4;
      color: var(--ink);
      border-radius: 0;
    }

    #q::placeholder {
      color: #999999;
    }

    #q:focus {
      outline: none;
      box-shadow: inset 0 0 0 1px var(--ink);
    }

    .hint {
      font-size: 13px;
      color: var(--ink-soft);
      margin: 0 0 36px;
    }

    .hint button {
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 600;
      background: none;
      border: none;
      color: var(--ink);
      padding: 3px 0;
      margin-right: 14px;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .hint button:hover {
      opacity: 0.6;
    }

    .range-field {
      display: inline-flex;
    }

    .range-input,
    .range-sep {
      border: 1px solid var(--ink);
      padding: 3px 9px;
      font-size: 12px;
      font-family: var(--sans);
      color: var(--ink);
      background: var(--bg);
      border-radius: 0;
      margin-left: -1px;
    }

    .range-field>*:first-child {
      margin-left: 0;
    }

    .range-sep {
      display: inline-flex;
      align-items: center;
    }

    .filter-row-pair {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      align-items: center;
      margin-bottom: 18px;
    }

    .filter-row-pair .filters.chips {
      margin-bottom: 0;
    }

    .range-input {
      width: 130px;
    }

    .range-input--narrow {
      width: 70px;
    }

    fieldset.filters {
      border: none;
      padding: 0;
      margin: 0 0 18px;
    }

    fieldset.filters legend {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--ink-soft);
      padding: 0 0 6px;
    }

    fieldset.filters label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--ink);
      margin: 0 16px 6px 0;
      cursor: pointer;
    }

    fieldset.filters input[type="checkbox"] {
      accent-color: var(--ink);
      width: 14px;
      height: 14px;
      cursor: pointer;
    }

    fieldset.filters.chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0;
      align-items: center;
    }


    .chip-label {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--ink-soft);
      margin-right: 10px;
    }


    .chip {
      position: relative;
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--ink);
      padding: 3px 9px;
      font-size: 12px;
      cursor: pointer;
      user-select: none;
      margin: 0 0 0 -1px;
    }

    .chip:first-child {
      margin-left: 0;
    }

    fieldset.filters.chips .chip {
      margin: 0 0 0 -1px;
    }

    fieldset.filters.chips .chip:first-child {
      margin-left: 0;
    }

    .chip:hover,
    .chip:has(input:focus-visible) {
      z-index: 1;
    }

    .chip input {
      position: absolute;
      opacity: 0;
      width: 1px;
      height: 1px;
    }

    .chip:has(input:checked) {
      background: var(--ink);
      color: var(--bg);
    }

    .chip:has(input:focus-visible) {
      outline: 2px solid var(--ink);
      outline-offset: 2px;
    }

    #status {
      font-size: 13px;
      color: var(--ink-soft);
      margin-bottom: 20px;
      min-height: 18px;
    }

    details.card {
      border-top: 1px solid var(--line);
      padding: 14px 0;
    }

    details.card:first-of-type {
      border-top: none;
    }

    summary.card-top {
      list-style: none;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap;
    }

    summary.card-top::-webkit-details-marker {
      display: none;
    }

    summary.card-top::before {
      content: "+";
      font-weight: 700;
      margin-right: 8px;
      display: inline-block;
      width: 0.8em;
    }

    details[open] summary.card-top::before {
      content: "–";
    }

    .address {
      font-weight: 700;
      font-size: 17px;
      color: var(--ink);
    }

    .meta {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: var(--ink-soft);
      white-space: nowrap;
    }

    .density {
      font-size: 13px;
      color: var(--ink-soft);
      margin-top: 3px;
    }

    .density b {
      color: var(--ink);
    }

    .viol-list {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px dashed var(--line);
    }

    .viol {
      padding: 6px 0;
      font-size: 14px;
    }

    .viol-tag {
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 11px;
      color: var(--ink-soft);
      margin-right: 6px;
    }

    .viol-apt {
      font-weight: 700;
      font-size: 12px;
      color: var(--ink-soft);
      margin-right: 6px;
    }

    mark {
      background: var(--ink);
      color: var(--bg);
      padding: 0 2px;
    }

    .empty {
      font-size: 14px;
      color: var(--ink-soft);
      padding: 40px 0;
      text-align: center;
    }

    footer {
      margin-top: 56px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
      font-size: 12px;
      color: var(--ink-soft);
    }

    footer a {
      text-decoration: underline;
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <header>
      <h1>Housing Violations Search</h1>
    </header>

    <div class="search-row">
      <input id="q" type="text" placeholder="Search an address…" autocomplete="off" />
    </div>

    <fieldset class="filters chips">
      <span class="chip-label">Issue</span>
      <label class="chip"><input type="checkbox" class="f-issue" value="mice" checked> Mice</label>
      <label class="chip"><input type="checkbox" class="f-issue" value="rats" checked> Rats</label>
      <label class="chip"><input type="checkbox" class="f-issue" value="mold" checked> Mold</label>
      <label class="chip"><input type="checkbox" class="f-issue" value="no-heat" checked> No Heat</label>
      <label class="chip"><input type="checkbox" class="f-issue" value="roaches" checked> Roaches</label>
      <label class="chip"><input type="checkbox" class="f-issue" value="fire-damage" checked> Fire Damage</label>
      <label class="chip"><input type="checkbox" class="f-issue" value="lead-paint" checked> Lead Paint</label>
      <label class="chip"><input type="checkbox" class="f-issue" value="other" checked> Other</label>
    </fieldset>

    <fieldset class="filters chips">
      <span class="chip-label">Borough</span>
      <label class="chip"><input type="checkbox" class="f-boro" value="MANHATTAN" checked> Manhattan</label>
      <label class="chip"><input type="checkbox" class="f-boro" value="BRONX" checked> Bronx</label>
      <label class="chip"><input type="checkbox" class="f-boro" value="BROOKLYN" checked> Brooklyn</label>
      <label class="chip"><input type="checkbox" class="f-boro" value="QUEENS" checked> Queens</label>
      <label class="chip"><input type="checkbox" class="f-boro" value="STATEN ISLAND" checked> Staten Island</label>
    </fieldset>

    <fieldset class="filters chips">
      <span class="chip-label">Class</span>
      <label class="chip"><input type="checkbox" class="f-class" value="A" checked> A &mdash; Non-hazardous</label>
      <label class="chip"><input type="checkbox" class="f-class" value="B" checked> B &mdash; Hazardous</label>
      <label class="chip"><input type="checkbox" class="f-class" value="C" checked> C &mdash; Immediately
        Hazardous</label>
    </fieldset>


    <div class="filter-row-pair">
      <div class="filters chips">
        <span class="chip-label">Date</span>
        <div class="range-field">
          <input id="min-date" type="date" class="range-input" />
          <span class="range-sep">to</span>
          <input id="max-date" type="date" class="range-input" />
        </div>
      </div>

      <div class="filters chips">
        <span class="chip-label">Units</span>
        <div class="range-field">
          <input id="min-units" type="number" min="0" placeholder="min" class="range-input range-input--narrow" />
          <span class="range-sep">to</span>
          <input id="max-units" type="number" min="0" placeholder="max" class="range-input range-input--narrow" />
        </div>
      </div>
    </div>


    <p id="status">Loading violations data…</p>
    <div id="results"></div>

    <footer>
      Not affiliated with HPD or JustFix.
    </footer>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/fuse.js/6.6.2/fuse.min.js"></script>
  <script src="search.js"></script>
</body>

</html>
